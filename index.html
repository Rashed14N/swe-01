    <script>
      // Gracefully silence expected sandbox WebSocket / Vite HMR connection notices and recoverable React notices
      function isMutedError(text) {
        var str = String(text || '');
        return (
          str.indexOf('WebSocket') !== -1 ||
          str.indexOf('@vite/client') !== -1 ||
          str.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
          str.indexOf('concurrent rendering') !== -1 ||
          str.indexOf('There was an error during concurrent rendering') !== -1
        );
      }

      window.onerror = function(message, source, lineno, colno, error) {
        var full = String(message || '') + ' ' + String(error ? error.message || error.stack : '');
        if (isMutedError(full)) {
          return true;
        }
      };

      window.addEventListener('error', function(event) {
        var msg = (event && (event.message || (event.error && (event.error.message || event.error.stack)))) || '';
        if (isMutedError(msg)) {
          if (event.preventDefault) event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function(event) {
        var reasonStr = String((event && event.reason && (event.reason.message || event.reason.stack || event.reason)) || '');
        if (isMutedError(reasonStr)) {
          if (event.preventDefault) event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          return true;
        }
      }, true);
    </script>
