<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-dik-dik-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <linearGradient id="grad-pango" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Background Disc -->
  <rect width="200" height="200" rx="44" fill="url(#bg-dik-dik-3)" />
  
  <!-- Artwork Container -->
  <g filter="url(#shadow)">
    
      <!-- Slender Head & Long Neck -->
      <path d="M92 120 L90 155 L110 155 L108 120 Z" fill="#D97706" />
      <!-- Head -->
      <ellipse cx="100" cy="95" rx="18" ry="24" fill="#D97706" />
      <ellipse cx="100" cy="108" rx="10" ry="12" fill="#FFFBEB" />
      <!-- Tiny Spiky Horns -->
      <line x1="92" y1="78" x2="88" y2="58" stroke="#78350F" stroke-width="3" stroke-linecap="round" />
      <line x1="108" y1="78" x2="112" y2="58" stroke="#78350F" stroke-width="3" stroke-linecap="round" />
      <!-- Huge Deer Eyes with White Rings -->
      <circle cx="84" cy="92" r="7" fill="#FFFBEB" />
      <circle cx="84" cy="92" r="5" fill="#1E293B" />
      <circle cx="82" cy="90" r="1.5" fill="#FFFFFF" />
      <circle cx="116" cy="92" r="7" fill="#FFFBEB" />
      <circle cx="116" cy="92" r="5" fill="#1E293B" />
      <circle cx="114" cy="90" r="1.5" fill="#FFFFFF" />
      <!-- Pointy Prehensile Nose -->
      <ellipse cx="100" cy="116" rx="4" ry="3" fill="#0F172A" />
      <!-- Big Leaf Ears -->
      <ellipse cx="70" cy="85" rx="12" ry="6" fill="#B45309" transform="rotate(-30 70 85)" />
      <ellipse cx="130" cy="85" rx="12" ry="6" fill="#B45309" transform="rotate(30 130 85)" />
    
  </g>
</svg>