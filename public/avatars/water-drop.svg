<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-water-drop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="grad-pango" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Background Disc -->
  <rect width="200" height="200" rx="44" fill="url(#bg-water-drop)" />
  
  <!-- Artwork Container -->
  <g filter="url(#shadow)">
    
      <!-- Pure 3D Water Drop -->
      <path d="M100 45 C70 95 55 120 55 135 C55 160 75 170 100 170 C125 170 145 160 145 135 C145 120 130 95 100 45 Z" fill="#0EA5E9" />
      <!-- Inner Glow -->
      <path d="M100 55 C78 98 65 122 65 135 C65 155 80 162 100 162 C120 162 135 155 135 135 C135 122 122 98 100 55 Z" fill="#38BDF8" />
      <!-- Specular Highlight -->
      <ellipse cx="85" cy="115" rx="10" ry="20" fill="#FFFFFF" opacity="0.6" transform="rotate(-20 85 115)" />
      <circle cx="92" cy="95" r="4" fill="#FFFFFF" opacity="0.8" />
      <!-- Smile -->
      <circle cx="90" cy="132" r="3" fill="#0369A1" />
      <circle cx="110" cy="132" r="3" fill="#0369A1" />
      <path d="M94 142 Q100 148 106 142" stroke="#0369A1" stroke-width="2.5" stroke-linecap="round" fill="none" />
    
  </g>
</svg>