<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-camera" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="grad-pango" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Background Disc -->
  <rect width="200" height="200" rx="44" fill="url(#bg-camera)" />
  
  <!-- Artwork Container -->
  <g filter="url(#shadow)">
    
      <!-- Camera Body -->
      <rect x="55" y="70" width="90" height="65" rx="14" fill="#1E293B" />
      <rect x="55" y="70" width="90" height="20" fill="#475569" rx="10" />
      <!-- Flash & Shutter -->
      <rect x="70" y="58" width="16" height="12" rx="3" fill="#64748B" />
      <rect x="115" y="60" width="18" height="10" rx="3" fill="#EF4444" />
      <circle cx="78" cy="78" r="4" fill="#FBBF24" />
      <!-- Big Lens Ring -->
      <circle cx="100" cy="106" r="24" fill="#334155" />
      <circle cx="100" cy="106" r="19" fill="#0F172A" />
      <circle cx="100" cy="106" r="14" fill="#0284C7" />
      <circle cx="100" cy="106" r="9" fill="#0369A1" />
      <!-- Glass Glint -->
      <ellipse cx="95" cy="100" rx="4" ry="7" fill="#38BDF8" opacity="0.8" transform="rotate(-30 95 100)" />
    
  </g>
</svg>