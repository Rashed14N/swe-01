<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-public-fountain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#7DD3FC" />
    </linearGradient>
    <linearGradient id="grad-pango" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Background Disc -->
  <rect width="200" height="200" rx="44" fill="url(#bg-public-fountain)" />
  
  <!-- Artwork Container -->
  <g filter="url(#shadow)">
    
      <!-- Fountain Basin Tier 1 -->
      <ellipse cx="100" cy="155" rx="55" ry="15" fill="#64748B" />
      <ellipse cx="100" cy="152" rx="50" ry="12" fill="#38BDF8" />
      <!-- Pedestal -->
      <path d="M92 125 L90 150 L110 150 L108 125 Z" fill="#94A3B8" />
      <!-- Tier 2 -->
      <ellipse cx="100" cy="125" rx="35" ry="10" fill="#64748B" />
      <ellipse cx="100" cy="123" rx="30" ry="8" fill="#38BDF8" />
      <!-- Spout -->
      <path d="M96 95 L94 123 L106 123 L104 95 Z" fill="#CBD5E1" />
      <!-- Water Jets -->
      <path d="M100 95 C90 60 70 75 75 120" stroke="#0284C7" stroke-width="4" stroke-linecap="round" fill="none" />
      <path d="M100 95 C110 60 130 75 125 120" stroke="#0284C7" stroke-width="4" stroke-linecap="round" fill="none" />
      <path d="M100 95 C100 50 100 50 100 120" stroke="#BAE6FD" stroke-width="3" stroke-linecap="round" fill="none" />
      <!-- Water Drops -->
      <circle cx="80" cy="75" r="3" fill="#38BDF8" />
      <circle cx="120" cy="75" r="3" fill="#38BDF8" />
      <circle cx="100" cy="50" r="3.5" fill="#E0F2FE" />
    
  </g>
</svg>