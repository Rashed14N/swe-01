<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-koala-8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="grad-pango" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Background Disc -->
  <rect width="200" height="200" rx="44" fill="url(#bg-koala-8)" />
  
  <!-- Artwork Container -->
  <g filter="url(#shadow)">
    
      <!-- Fluffy Big Ears -->
      <circle cx="64" cy="78" r="22" fill="#94A3B8" />
      <circle cx="64" cy="78" r="14" fill="#F8FAFC" />
      <circle cx="136" cy="78" r="22" fill="#94A3B8" />
      <circle cx="136" cy="78" r="14" fill="#F8FAFC" />
      <!-- Head -->
      <circle cx="100" cy="100" r="32" fill="#94A3B8" />
      <ellipse cx="100" cy="108" rx="20" ry="16" fill="#F1F5F9" />
      <!-- Big Iconic Koala Nose -->
      <rect x="91" y="92" width="18" height="24" rx="9" fill="#1E293B" />
      <!-- Eyes -->
      <circle cx="82" cy="94" r="3.5" fill="#1E293B" />
      <circle cx="118" cy="94" r="3.5" fill="#1E293B" />
      <!-- Eucalyptus Leaf in mouth -->
      <path d="M105 116 C120 110 135 118 130 130 C115 125 105 116 105 116 Z" fill="#10B981" />
      <line x1="108" y1="117" x2="126" y2="124" stroke="#047857" stroke-width="1.5" />
      <!-- Body & Paws -->
      <ellipse cx="100" cy="142" rx="28" ry="20" fill="#64748B" />
    
  </g>
</svg>