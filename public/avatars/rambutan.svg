      <!-- Cute Face on the fruit -->
      <circle cx="88" cy="112" r="3.5" fill="#4C0519" />
      <circle cx="112" cy="112" r="3.5" fill="#4C0519" />
      <path d="M94 122 Q100 128 106 122" stroke="#4C0519" stroke-width="2" stroke-linecap="round" fill="none" />
    
  </g>
</svg>