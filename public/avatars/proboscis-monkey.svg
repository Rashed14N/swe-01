<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-proboscis-monkey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="grad-pango" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Background Disc -->
  <rect width="200" height="200" rx="44" fill="url(#bg-proboscis-monkey)" />
  
  <!-- Artwork Container -->
  <g filter="url(#shadow)">
    
      <!-- Fur Collar -->
      <circle cx="100" cy="120" r="42" fill="#D97706" />
      <!-- Face -->
      <circle cx="100" cy="98" r="26" fill="#FDE68A" />
      <!-- Big signature nose -->
      <path d="M94 92 C94 80 106 80 106 92 C106 115 112 125 100 125 C88 125 94 115 94 92 Z" fill="#F59E0B" />
      <!-- Eyes -->
      <circle cx="86" cy="90" r="3" fill="#1E293B" />
      <circle cx="114" cy="90" r="3" fill="#1E293B" />
      <!-- Round Ears -->
      <circle cx="72" cy="96" r="8" fill="#F59E0B" />
      <circle cx="128" cy="96" r="8" fill="#F59E0B" />
      <!-- Pot Belly -->
      <ellipse cx="100" cy="145" rx="30" ry="20" fill="#B45309" />
    
  </g>
</svg>