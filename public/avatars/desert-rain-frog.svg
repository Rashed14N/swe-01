<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-desert-rain-frog" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5" />
      <stop offset="100%" stop-color="#D1FAE5" />
    </linearGradient>
    <linearGradient id="grad-pango" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Background Disc -->
  <rect width="200" height="200" rx="44" fill="url(#bg-desert-rain-frog)" />
  
  <!-- Artwork Container -->
  <g filter="url(#shadow)">
    
      <!-- Super Round Chunky Body -->
      <circle cx="100" cy="115" r="42" fill="#D97706" />
      <circle cx="100" cy="115" r="39" fill="#FDE68A" />
      <!-- Sand specks -->
      <circle cx="85" cy="110" r="2" fill="#B45309" />
      <circle cx="115" cy="110" r="2" fill="#B45309" />
      <circle cx="100" cy="130" r="2" fill="#B45309" />
      <circle cx="92" cy="120" r="1.5" fill="#B45309" />
      <!-- Big Bulging Eyes on top -->
      <circle cx="80" cy="82" r="10" fill="#FDE68A" />
      <circle cx="80" cy="82" r="7" fill="#0F172A" />
      <circle cx="78" cy="80" r="2.5" fill="#FFFFFF" />
      <circle cx="120" cy="82" r="10" fill="#FDE68A" />
      <circle cx="120" cy="82" r="7" fill="#0F172A" />
      <circle cx="118" cy="80" r="2.5" fill="#FFFFFF" />
      <!-- Squeaky grumpy mouth -->
      <path d="M90 102 Q100 96 110 102" stroke="#78350F" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <!-- Tiny Feet -->
      <ellipse cx="65" cy="148" rx="8" ry="4" fill="#D97706" />
      <ellipse cx="135" cy="148" rx="8" ry="4" fill="#D97706" />
    
  </g>
</svg>