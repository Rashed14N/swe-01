<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-pangolin-cream-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <linearGradient id="grad-pango" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Background Disc -->
  <rect width="200" height="200" rx="44" fill="url(#bg-pangolin-cream-2)" />
  
  <!-- Artwork Container -->
  <g filter="url(#shadow)">
    
      <!-- Pangolin Cream -->
      <ellipse cx="100" cy="120" rx="45" ry="35" fill="url(#grad-pango)" />
      <!-- Scales -->
      <path d="M70 100 Q100 80 130 100 Q100 120 70 100 Z" fill="#B45309" opacity="0.8" />
      <path d="M60 115 Q100 95 140 115 Q100 135 60 115 Z" fill="#D97706" />
      <path d="M70 130 Q100 110 130 130 Q100 150 70 130 Z" fill="#92400E" />
      <!-- Head -->
      <path d="M135 110 Q165 115 155 125 Q135 130 130 120 Z" fill="#F59E0B" />
      <circle cx="148" cy="116" r="3" fill="#1E293B" />
      <circle cx="149" cy="115" r="1" fill="#FFFFFF" />
      <!-- Soft paws -->
      <ellipse cx="80" cy="150" rx="10" ry="6" fill="#D97706" />
      <ellipse cx="120" cy="150" rx="10" ry="6" fill="#D97706" />
    
  </g>
</svg>