<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-domestic-shorthair-tabby-cat-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="grad-pango" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Background Disc -->
  <rect width="200" height="200" rx="44" fill="url(#bg-domestic-shorthair-tabby-cat-2)" />
  
  <!-- Artwork Container -->
  <g filter="url(#shadow)">
    
      <!-- Cat Head & Body -->
      <circle cx="100" cy="115" r="38" fill="#94A3B8" />
      <ellipse cx="100" cy="125" rx="24" ry="20" fill="#F8FAFC" />
      <!-- Tabby Stripes -->
      <path d="M100 80 L100 95 M88 84 L93 96 M112 84 L107 96" stroke="#475569" stroke-width="3" stroke-linecap="round" />
      <!-- Ears -->
      <polygon points="68,95 62,60 88,80" fill="#64748B" />
      <polygon points="72,90 68,68 84,82" fill="#FDA4AF" />
      <polygon points="132,95 138,60 112,80" fill="#64748B" />
      <polygon points="128,90 132,68 116,82" fill="#FDA4AF" />
      <!-- Big Emerald Eyes -->
      <ellipse cx="84" cy="108" rx="6" ry="7" fill="#10B981" />
      <ellipse cx="84" cy="108" rx="2" ry="6" fill="#064E3B" />
      <circle cx="82" cy="105" r="1.5" fill="#FFFFFF" />
      <ellipse cx="116" cy="108" rx="6" ry="7" fill="#10B981" />
      <ellipse cx="116" cy="108" rx="2" ry="6" fill="#064E3B" />
      <circle cx="114" cy="105" r="1.5" fill="#FFFFFF" />
      <!-- Pink Nose & Mouth -->
      <polygon points="97,118 103,118 100,122" fill="#FB7185" />
      <path d="M95 125 Q100 128 105 125" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none" />
      <!-- Whiskers -->
      <line x1="65" y1="120" x2="85" y2="122" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />
      <line x1="65" y1="126" x2="85" y2="125" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />
      <line x1="135" y1="120" x2="115" y2="122" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />
      <line x1="135" y1="126" x2="115" y2="125" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />
    
  </g>
</svg>