<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-giraffe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>
    <linearGradient id="grad-pango" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Background Disc -->
  <rect width="200" height="200" rx="44" fill="url(#bg-giraffe)" />
  
  <!-- Artwork Container -->
  <g filter="url(#shadow)">
    
      <!-- Tall Slender Neck -->
      <rect x="88" y="95" width="24" height="65" rx="8" fill="#F59E0B" />
      <!-- Spots on Neck -->
      <rect x="92" y="105" width="10" height="8" rx="3" fill="#B45309" />
      <rect x="98" y="122" width="10" height="9" rx="3" fill="#B45309" />
      <rect x="90" y="140" width="12" height="8" rx="3" fill="#B45309" />
      <!-- Head -->
      <ellipse cx="100" cy="80" rx="16" ry="22" fill="#F59E0B" />
      <ellipse cx="100" cy="94" rx="12" ry="10" fill="#FFFBEB" />
      <!-- Ossicones (Horns with knobby tips) -->
      <line x1="93" y1="62" x2="91" y2="48" stroke="#92400E" stroke-width="3" stroke-linecap="round" />
      <circle cx="91" cy="46" r="3.5" fill="#78350F" />
      <line x1="107" y1="62" x2="109" y2="48" stroke="#92400E" stroke-width="3" stroke-linecap="round" />
      <circle cx="109" cy="46" r="3.5" fill="#78350F" />
      <!-- Big Gentle Eyes with Lashes -->
      <circle cx="88" cy="78" r="4" fill="#1E293B" />
      <circle cx="87" cy="77" r="1.2" fill="#FFFFFF" />
      <circle cx="112" cy="78" r="4" fill="#1E293B" />
      <circle cx="111" cy="77" r="1.2" fill="#FFFFFF" />
      <!-- Nostrils -->
      <circle cx="96" cy="96" r="1.5" fill="#78350F" />
      <circle cx="104" cy="96" r="1.5" fill="#78350F" />
    
  </g>
</svg>