<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-goat-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5" />
      <stop offset="100%" stop-color="#A7F3D0" />
    </linearGradient>
    <linearGradient id="grad-pango" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Background Disc -->
  <rect width="200" height="200" rx="44" fill="url(#bg-goat-3)" />
  
  <!-- Artwork Container -->
  <g filter="url(#shadow)">
    
      <!-- Goat Body -->
      <ellipse cx="100" cy="125" rx="35" ry="28" fill="#F8FAFC" />
      <!-- Head -->
      <ellipse cx="100" cy="85" rx="20" ry="24" fill="#F1F5F9" />
      <!-- Snout -->
      <ellipse cx="100" cy="98" rx="12" ry="10" fill="#E2E8F0" />
      <ellipse cx="96" cy="98" rx="2" ry="3" fill="#475569" />
      <ellipse cx="104" cy="98" rx="2" ry="3" fill="#475569" />
      <!-- Horns -->
      <path d="M88 70 Q75 40 60 50 Q75 60 85 75 Z" fill="#D97706" />
      <path d="M112 70 Q125 40 140 50 Q125 60 115 75 Z" fill="#D97706" />
      <!-- Ears -->
      <ellipse cx="75" cy="85" rx="14" ry="6" fill="#F8FAFC" transform="rotate(-20 75 85)" />
      <ellipse cx="125" cy="85" rx="14" ry="6" fill="#F8FAFC" transform="rotate(20 125 85)" />
      <!-- Eyes -->
      <circle cx="89" cy="80" r="3.5" fill="#1E293B" />
      <circle cx="111" cy="80" r="3.5" fill="#1E293B" />
      <!-- Beard -->
      <path d="M96 108 L100 122 L104 108 Z" fill="#E2E8F0" />
      <!-- Legs -->
      <rect x="80" y="145" width="8" height="18" rx="4" fill="#E2E8F0" />
      <rect x="112" y="145" width="8" height="18" rx="4" fill="#E2E8F0" />
    
  </g>
</svg>