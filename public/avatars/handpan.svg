<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-handpan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="grad-pango" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Background Disc -->
  <rect width="200" height="200" rx="44" fill="url(#bg-handpan)" />
  
  <!-- Artwork Container -->
  <g filter="url(#shadow)">
    
      <!-- Handpan Metallic Dome -->
      <ellipse cx="100" cy="115" rx="48" ry="34" fill="#334155" />
      <ellipse cx="100" cy="110" rx="44" ry="30" fill="#475569" />
      <!-- Center Ding Tone Field -->
      <ellipse cx="100" cy="106" rx="14" ry="10" fill="#1E293B" />
      <ellipse cx="100" cy="104" rx="8" ry="5" fill="#64748B" />
      <!-- Surrounding Tone Dents -->
      <ellipse cx="78" cy="95" rx="7" ry="5" fill="#1E293B" />
      <ellipse cx="122" cy="95" rx="7" ry="5" fill="#1E293B" />
      <ellipse cx="70" cy="115" rx="7" ry="5" fill="#1E293B" />
      <ellipse cx="130" cy="115" rx="7" ry="5" fill="#1E293B" />
      <ellipse cx="85" cy="128" rx="7" ry="5" fill="#1E293B" />
      <ellipse cx="115" cy="128" rx="7" ry="5" fill="#1E293B" />
      <!-- Metallic Luster Highlights -->
      <path d="M60 100 Q100 80 140 100" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
    
  </g>
</svg>